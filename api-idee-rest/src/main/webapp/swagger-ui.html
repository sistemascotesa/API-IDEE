<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API IDEE - Swagger UI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body { margin: 0; }
    .swagger-ui .info .url { display: none; }
  </style>
</head>
<body>

  <div id="swagger-ui"></div>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>

  <script>
    window.onload = function () {
      SwaggerUIBundle({
        urls: [
          { url: "./data/swagger/layerswitcher.json", name: "Layerswitcher" },
          { url: "./data/swagger/timeline.json",      name: "Timeline"      }
        ],
        "urls.primaryName": "Layerswitcher",
        dom_id: "#swagger-ui",
        deepLinking: true,
        displayRequestDuration: true,
        defaultModelsExpandDepth: 2,
        defaultModelExpandDepth: 2,
        docExpansion: "list",
        filter: false,
        showExtensions: true,
        tryItOutEnabled: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl,
          (system) => ({
            statePlugins: {
              spec: {
                wrapActions: {
                  updateJsonSpec: (oriAction) => (...args) => {
                    const result = oriAction(...args);
                    // Al cambiar de spec, limpia el body editado de POST /api/js
                    // para evitar que el valor del spec anterior aparezca como "Modified value"
                    setTimeout(() => {
                      try {
                        system.oas3Actions.setRequestBodyValue({
                          value: undefined,
                          pathMethod: ['/api/js', 'post']
                        });
                      } catch (e) {}
                    }, 0);
                    return result;
                  }
                }
              }
            }
          })
        ],
        layout: "StandaloneLayout"
      });
    };
  </script>
</body>
</html>
