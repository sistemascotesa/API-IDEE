<div id="div-contenedor" class="m-timeline-container">
    <div id="m-timeline-title">{{translations.title}}</div>
    <div class="div-m-timeline-panel">
        <div class="div-m-timeline-slider">
            <input type="range" min="0" max="100" value="0" step="{{inputRange.step}}" id="input-slider"></input>
            <div class='slider-tags'></div>
        </div>
        <div class="m-timeline-controls">
            <div class="m-timeline-layer-selectors">
                <select class="m-timeline-names" id="m-timeline-select-layer">
                </select>
                <select class="m-timeline-names-next" id="m-timeline-select-layer-next">
                </select>
            </div>
            <div class="m-timeline-button">
                <div id="m-timeline-play" class="timeline-control-siguiente g-cartografia-control-siguiente"
                    title="Iniciar paso del tiempo"></div>
            </div>
        </div>
    </div>
</div>
