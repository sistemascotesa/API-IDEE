<div aria-label="Plugin Selection Zoom" role="menuitem"  id="div-contenedor" class="m-control m-container m-selectionzoom">
    <div role="tab" tabindex="0" class="m-plugin-panel-title" id="m-selectionzoom-titulo">{{translations.headertitle}}</div>
    <div id="m-selectionzoom-previews">
        {{#each layers}}
            <div aria-label="{{this.title}}" tabindex="0" role="tab" id="m-selectionzoom-lyr-{{this.id}}" title="{{this.title}}">
                <div class="lyr-img-frame">
                    <img aria-hidden="true" src="{{this.preview}}" alt="{{this.title}}"/>
                </div>
                <span aria-hidden="true" title="{{this.title}}">{{this.title}}</span>
            </div>
        {{/each}}
        <!-- <button class="m-selectionzoom-unique-btn" id="m-selectionzoom-unique-btn" title="Selección de capa de fondo"></button> -->
    </div>
</div>
