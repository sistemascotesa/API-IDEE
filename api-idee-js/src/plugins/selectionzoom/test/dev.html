<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="idee" content="yes">
    <title>SelectionZoom TEST</title>
    <link href="https://componentes-beta.idee.es/api-idee/assets/css/apiidee.ol.min.css" rel="stylesheet" />
</head>

<body>
    <div class="m-api-idee-test-form-frame">
        <div class="m-test-form">
            <div>
                <label for="selectPosition" title="Posición del plugin sobre el mapa. Por defecto: izquierda">Posición "position"</label>
                <select name="position" id="selectPosition">
                    <option value="" selected="selected"></option>
                    <option value="left">Izquierda</option>
                    <option value="right">Derecha</option>
                </select>
            </div>
            <div>
                <label for="selectCollapsed" title="Indica si el plugin viene colapsado de entrada (true/false). Por defecto: true">Colapsado "collapsed"</label>
                <select name="collapsed" id="selectCollapsed">
                    <option value="" selected="selected"></option>
                    <option value="true">true</option>
                    <option value="false">false</option>
                </select>
            </div>
            <div>
                <label for="inputOrder" title="Define en qué posición del panel debe aparecer en el conjunto de controles o plugins">Orden entre controles / plugins "order"</label>
                <input type="number" name="order" id="inputOrder" list="orderSug" value="-1">
            </div>
            <div>
                <label for="inputTooltip" title="Texto que se muestra al dejar el ratón encima del plugin. Por defecto: Vistas predefinidas">Título de la herramienta "tooltip"</label>
                <input type="text" name="tooltip" id="inputTooltip" list="tooltipSug" value="Vistas predefinidas">
                <datalist id="tooltipSug">
                    <option value="Vistas predefinidas"></option>
                </datalist>
            </div>
            <div>
                <label for="inputOptions" title="Array JSON de zonas predefinidas. Cada zona puede tener: id, title, preview, bbox o (zoom + center)">Zonas predefinidas "options"</label>
                <input type="text" name="options" id="inputOptions" list="optionsSug" value='[{"id":"peninsula","title":"Peninsula","preview":"../src/facade/assets/images/espana.png","bbox":"-1200091.444315327, 4348955.797933925, 365338.89496508264, 5441088.058207252"},{"id":"canarias","title":"Canarias","preview":"../src/facade/assets/images/canarias.png","center":"-1844272.618465, 3228700.074766","zoom":8},{"id":"baleares","title":"Baleares","preview":"../src/facade/assets/images/baleares.png","bbox":"115720.89020469127,4658411.436032817,507078.4750247937,4931444.501067467"},{"id":"ceuta","title":"Ceuta","preview":"../src/facade/assets/images/ceuta.png","bbox":"-599755.2558583047, 4281734.817081453, -587525.3313326766, 4290267.100363785"},{"id":"melilla","title":"Melilla","preview":"../src/facade/assets/images/melilla.png","center":"-327838.4143151213, 4203788.135342773","zoom":14}]'>
                <datalist id="optionsSug">
                    <option value='[{"id":"peninsula","title":"Peninsula","preview":"../src/facade/assets/images/espana.png","bbox":"-1200091.444315327, 4348955.797933925, 365338.89496508264, 5441088.058207252"},{"id":"canarias","title":"Canarias","preview":"../src/facade/assets/images/canarias.png","center":"-1844272.618465, 3228700.074766","zoom":8},{"id":"baleares","title":"Baleares","preview":"../src/facade/assets/images/baleares.png","bbox":"115720.89020469127,4658411.436032817,507078.4750247937,4931444.501067467"},{"id":"ceuta","title":"Ceuta","preview":"../src/facade/assets/images/ceuta.png","bbox":"-599755.2558583047, 4281734.817081453, -587525.3313326766, 4290267.100363785"},{"id":"melilla","title":"Melilla","preview":"../src/facade/assets/images/melilla.png","center":"-327838.4143151213, 4203788.135342773","zoom":14}]'></option>
                    <option value='[{"id":"peninsula","title":"Peninsula","preview":"../src/facade/assets/images/espana.png","center":"-417376.27467512223, 4895021.928070588", "zoom": "6"}]'></option>
                </datalist>
            </div>
        </div>
        <div class="m-test-buttons">
            <button name="eliminar" class="m-test-button" id="removeButton">Eliminar Plugin</button>
        </div>
    </div>
    <div id="mapjs" class="container"></div>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/js/apiidee.ol.min.js"></script>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/js/configuration.js"></script>
    <script type="text/javascript" src="/main.js"></script>
</body>

</html>
