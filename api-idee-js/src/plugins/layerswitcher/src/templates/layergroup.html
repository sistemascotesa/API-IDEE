<li class="m-layerswitcher-sectionPanel m-layerswitcher-sectionPanel-colorPanel" data-layer-id="{{idLayer}}" data-layer-name="{{id}}" data-layer-type="{{type}}" data-layer-url="{{url}}" data-order="{{dataOrder}}">
    <section class="m-layerswitcher-sectionPanel-header">
        <div>
            {{#if isEyes}}
            <button title="{{#if visible}}{{translations.hide_service}}{{^}}{{translations.show_service}}{{/if}}"
                aria-label="{{#if visible}}{{translations.hide_service}}{{^}}{{translations.show_service}}{{/if}}"
                tabindex="0"
                data-select-type="eye"
                data-layer-id="{{idLayer}}"
                class="m-layerswitcher-visible-control-button m-layerswitcher-check secondary {{#if visible}}g-cartografia-btn-layerswitcher-ver{{^}}g-cartografia-btn-layerswitcher-ocultar{{/if}} {{#if outOfRange}}m-layerswitcher-outOfRange{{/if}}">
            </button>
            {{/if}}
            {{#if isRadio}}
            <div>
                <input
                aria-label="{{#if visible}}{{translations.hide_service}}{{^}}{{translations.show_service}}{{/if}}"
                tabindex="0"
                {{#eq checkedLayer "true" }}checked{{/eq}}
                type="radio"
                data-layer-id="{{idLayer}}"
                data-select-type="radio"
                class="m-layerswitcher-check {{#if outOfRange}}m-layerswitcher-outOfRange-input{{/if}}"
                name="{{nameRadio}}"
                value="{{type}}-{{id}}">
            </div>
            {{/if}}

            {{#if isDelete}}
            <button
                data-layer-id="{{idLayer}}"
                title="{{translations.remove_layer}}"
                tabindex="0"
                aria-label="{{translations.remove_layer}}"
                class="secondary g-cartografia-btn-layerswitcher-delete">
            </button>
            {{/if}}

            <p tabindex="0"
            class="m-layerswitcher-layergroup-name"
            data-layer-id="{{idLayer}}"
            data-layer-type="{{type}}"
            data-layer-name="{{id}}"
            title="{{changeName}}"
            data-layer-url="{{url}}">
                {{title}}
            </p>

            <button
                class="{{#if displayGroup}}m-layerswitcher-icons-colapsar secondary g-cartografia-btn-layerswitcher-colapsar{{else}}m-layerswitcher-icons-desplegar secondary g-cartografia-btn-layerswitcher-desplegar{{/if}}  m-layerswitcher-groupDisplay"
                data-layer-id="{{idLayer}}"
                title="{{#if displayGroup}} {{hide_group}} {{else}} {{show_group}} {{/if}}"
                aria-label="{{#if displayGroup}} {{hide_group}} {{else}} {{show_group}} {{/if}}"
            ></button>
        </div>
    </section>
    <ul {{^displayGroup}}hidden{{/displayGroup}} tabindex="0" class="layerswitcher-ul-layersGroup nested-sortable" data-layer-name="{{id}}" data-layer-id="{{idLayer}}"></ul>
</li>
