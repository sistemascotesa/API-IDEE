<div aria-label="Plugin Comparators" role="menuitem" id="div-contenedor-comparators" class="m-plugin-panel-content">
    <ul id="m-comparators-previews" class="m-api-idee-tabs-container">
        {{#if mirrorpanelParams}}
            <li tabindex="0" aria-label="{{translations.mirrorpanelParams_tooltip}}" id='mirrorpanel-btn' class="m-api-idee-tab g-cartografia-btn-comparators-mirrorpanel" title="{{translations.mirrorpanelParams_tooltip}}"></li>
        {{/if}}

        {{#if windowsyncParams}}
            <li id="windowsync-btn"  aria-label="{{translations.windowsyncParams_tooltip}}" title="{{translations.windowsyncParams_tooltip}}" class="m-api-idee-tab g-cartografia-btn-comparators-windowsync"></li>
        {{/if}}

        {{#if lyrcompareParams}}
            <li tabindex="0" aria-label="{{translations.lyrcompareParams_tooltip}}" id='lyrcompare-btn' class="m-api-idee-tab g-cartografia-btn-comparators-lyrcompare" title="{{translations.lyrcompareParams_tooltip}}"></li>
        {{/if}}

        {{#if transparencyParams}}
            <li tabindex="0" aria-label="{{translations.transparencyParams_tooltip}}" id='transparency-btn' class="m-api-idee-tab g-cartografia-btn-comparators-transparency" title="{{translations.transparencyParams_tooltip}}"></li>
        {{/if}}
    </ul>
    <div id="m-comparators-contents"></div>
</div>
