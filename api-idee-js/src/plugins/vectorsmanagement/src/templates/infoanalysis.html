<section class="coords-table-container">
    {{#if point}}
    <table>
        <tr>
            <th></th>
            <th>Coordenadas</th>
        </tr>
        <tr>
            <th scope="row">X</th>
            <td>{{point.x}}</td>
        </tr>
        <tr>
            <th scope="row">Y</th>
            <td>{{point.y}}</td>
        </tr>
    </table>
    {{/if}}
    {{#if line}}
    <table>
        <tr tabindex="0">
            <th></th>
            <th>Distancia</th>
        </tr>
        <tr>
            <th scope="row">2D</th>
            <td>{{line.length}} {{line.units}}</td>
        </tr>
        <tr>
            <th scope="row">3D</th>
            <td id="ellipsoidal3DLength">Calculando...</td>
        </tr>
    </table>
    {{/if}}
    {{#if polygon}}
    <table>
        <tr tabindex="0">
            <th></th>
            <th>Área</th>
        </tr>
        <tr>
            <th scope="row">Superficie</th>
            <td>{{polygon.area}}{{polygon.areaUnits}}<sup>2</sup></td>
        </tr>
    </table>
    {{/if}}
</section>
