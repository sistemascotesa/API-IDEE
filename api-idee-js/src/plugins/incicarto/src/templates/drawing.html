<div id="drawingtools" class="m-drawingtools-content">
    <div class="collapsor" id="collapsorButton"><span>{{translations.collapse}}</span></div>
    <div class="drawingToolsContainer">
        <div id="styleOptions">
            <label>{{translations.color}} <input id="colorSelector" type="color" value="#71a7d3"></label>
            <label>{{translations.thickness}} <input id="thicknessSelector" type="number" value="6" min="1" max="10"></label>
            <div class="stroke-container" style="display: none;">
              <span class="title">{{translations.line}}</span>
              <div class="stroke-options" id="strokeOptions">
                <div class="stroke-option-default"></div>
                <div class="options-select">
                  <div class="stroke-option stroke-continuous active" data-value="continuous"></div>
                  <div class="stroke-option stroke-dots" data-value="dots"></div>
                  <div class="stroke-option stroke-lines" data-value="lines"></div>
                  <div class="stroke-option stroke-dots-lines" data-value="dots-lines"></div>
                </div>
              </div>
            </div>
        </div>
        <div id="featureInfo"></div>
        <div class="m-incicarto-layer-btn-container">
          <button class="m-incicarto-layer-delete-feature">{{translations.delete_geom}}</button>
          <button class="m-incicarto-layer-profile" style="display: none;">{{translations.query_profile}}</button>
        </div>
    </div>
</div>
