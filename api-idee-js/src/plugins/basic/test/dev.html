<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="idee" content="yes">
    <title>Basic TEST</title>
    <link href="https://componentes-beta.idee.es/api-idee/assets/css/apiidee.ol.min.css" rel="stylesheet" />
</head>

<body>
    <div class="m-api-idee-test-form-frame">
        <div class="m-test-form" style="max-height: 13rem;">
            <div>
                <label for="selectPosition" title="Posición del plugin sobre el mapa. Por defecto: right">Posición "position"</label>
                <select name="position" id="selectPosition">
                    <option value="" selected="selected"></option>
                    <option value="left">Izquierda (left)</option>
                    <option value="right">Derecha (right)</option>
                </select>
            </div>
            <div>
                <label for="selectCollapsed" title="Indica si el plugin viene colapsado de entrada. Por defecto: true">Colapsado "collapsed"</label>
                <select name="collapsed" id="selectCollapsed">
                    <option value="" selected="selected"></option>
                    <option value="true">true</option>
                    <option value="false">false</option>
                </select>
            </div>
            <div>
                <label for="inputOrder"
                    title="Define en que posición del panel debe aparecer en el conjunto de controles o plugins">Orden
                    entre controles / plugins "order"</label>
                <input type="number" name="order" id="inputOrder" value="-1">
            </div>
            <div>
                <label for="inputTooltip" title="Información emergente que se muestra al dejar el ratón encima del plugin. Por defecto: Plantilla plugin">Tooltip del plugin "tooltip"</label>
                <input type="text" id="inputTooltip" list="tooltipSug">
                <datalist id="tooltipSug">
                    <option value="Plantilla plugin"></option>
                </datalist>
            </div>
            <div>
                <label for="inputSvgPath" title="Ruta al SVG que se usa como icono del botón del plugin">Ruta SVG del icono "svgPath"</label>
                <input type="text" id="inputSvgPath" list="svgPathSug">
                <datalist id="svgPathSug">
                    <option value="https://componentes.idee.es/estaticos/Simbologia/svg/icons_cota/icn_tool.svg"></option>
                </datalist>
            </div>
            <div>
                <label for="inputMinWidthPanel"
                    title="Define la anchura mínima del panel del plugin. Mínimo 270px y máximo 600px">Anchura mínima panel "minWidthPanel"</label>
                <input type="number" name="minWidthPanel" id="inputMinWidthPanel" min="270" max="600">
            </div>
            <div>
                <label for="inputMaxWidthPanel"
                    title="Define la anchura máxima del panel del plugin. Mínimo 270px y máximo 600px">Anchura máxima panel "maxWidthPanel"</label>
                <input type="number" name="maxWidthPanel" id="inputMaxWidthPanel" min="270" max="600">
            </div>
            <div>
                <label for="inputPluginContent" title='Una URL válida o el contenido de un fichero HTML a incrustar en el panel'>Contenido del panel "content"</label>
                <input type="text" id="inputPluginContent" list="pluginContentSug">
                <datalist id="pluginContentSug">
                    <option value="<p>Contenido personalizado del plugin que se despliega en el panel.</p>"></option>
                </datalist>
            </div>
        </div>
        <div class="m-test-buttons">
            <button name="eliminar" class="m-test-button" id="removeButton">Eliminar Plugin</button>
        </div>
    </div>

    <div id="mapjs" class="container"></div>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/js/apiidee.ol.min.js"></script>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/js/configuration.js"></script>
    <script type="text/javascript" src="/main.js"></script>
</body>

</html>
