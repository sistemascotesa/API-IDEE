<div id="plugin-panel-content-storymap" class="m-plugin-panel-content" aria-label="Plugin storymap" role="menuitem">
    <div class="m-storymap-panel" id="m-storymap-panel">
        <main class="mainStoryMap d-flex-center">
            <div class="navPointer d-flex-column-center" id="navPointer">

                <button speed="{{speed}}" id="buttonDelay" class="secondary buttonDelay">
                    x1
                </button>

                <button class="secondary buttonPlay" id="play"></button>
                <button class="secondary buttonPause" id="pause" style="display: none;"></button>

            </div>
            <div class="navStep d-flex-column-center" id="navStep">
            </div>
            <div class="navContent d-flex-center">
                <section id="contentStoryMap" class="contentStoryMap">
                    <header class="header_contentStoryMap">
                        <div class="m-storymap-title" id="title_contentStoryMap">title</div>
                        <div class="m-storymap-subtitle" id="subtitle_contentStoryMap">sub</div>
                    </header>

                </section>
            </div>
            <div class="m-storymap-instructions">
                {{instructions}}
            </div>
        </main>
    </div>

</div>
