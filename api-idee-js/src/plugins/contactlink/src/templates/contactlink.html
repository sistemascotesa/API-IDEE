<div id="div-contenedor-m-contactlink" class="m-control m-container m-contactlink">
    <div class="links">
        <div role="navigation" tabindex="0" aria-label="{{accessibility.webLinks}}" class="web">
            <div class="web1">
                <a role="link" tabindex="0" class="link" href="{{urls.cnig}}" target="_blank"
                    title="{{links.downloads}}">
                    <div class="img g-cartografia-download"></div>
                    <figcaption>{{links.downloads}}</figcaption>
                </a>
                <a role="link" tabindex="0" class="link" id="urlPNOAContactLink" title="{{links.compare}}">
                    <div class="img g-cartografia-compare"></div>
                    <figcaption>{{links.compare}}</figcaption>
                </a>
            </div>

            <div class="web2">
                <a role="link" tabindex="0" class="link" id="urlStereoLink" title="{{links.display}}">
                    <div class="img g-cartografia-3d"></div>
                    <figcaption>{{links.display}}</figcaption>
                </a>
                <a role="link" tabindex="0" class="link" id="urlFototecaContactLink" title="{{links.photo}}">
                    <div class="img g-cartografia-images"></div>
                    <figcaption>{{links.photo}}</figcaption>
                </a>
            </div>
        </div>
        <hr />
        <div role="navigation" tabindex="0" aria-label="{{accessibility.socialMedia}}" class="social">
            <a class="link g-cartografia-twitter" role="link" tabindex="0" href="{{urls.twitter}}" target="_blank" title="Twitter IGN"></a>
            <a class="link g-cartografia-instagram" role="link" tabindex="0" href="{{urls.instagram}}" target="_blank" title="Instagram IGN"></a>
            <a class="link g-cartografia-facebook" role="link" tabindex="0" href="{{urls.facebook}}" target="_blank" title="Facebook"></a>
            <a class="link g-cartografia-pinterest" role="link" tabindex="0" href="{{urls.pinterest}}" target="_blank" title="Pinterest"></a>
            <a class="link g-cartografia-youtube" role="link" tabindex="0" href="{{urls.youtube}}" target="_blank" title="Youtube"></a>
            <a class="link g-cartografia-mail" role="link" tabindex="0" href="{{urls.mail}}" target="_blank" title="Email IGN"></a>
        </div>
    </div>
</div>
