<div class="m-control m-container m-infocoordinates">

    <div class="div-m-infocoordinates-panel">

        <!-- <div role="heading" tabindex="0" class="m-infocoordinates-title">
            <p id="titleInfo" class="m-infocoordinates-titleInfo">{{translations.title}}</p>
        </div> -->

        <div class="m-infocoordinates-content">
            <!-- Tabs -->
            <div class="m-infocoordinates-tabs">

            </div>

            <div id="tabContent" class='m-infocoordinates-tabContent'>
                <div class="infocoordinates-data-grid">
                    <div class="grid-row">
                        <span class="grid-label">{{translations.point}}</span>
                        <span id="m-infocoordinates-point" class="grid-value">--</span>
                        <button type="button" id="m-infocoordinates-buttonRemovePoint" class="icon-button" title="{{translations.removePoint}}">
                            <img src="{{helpIconUrlPapelera}}" />
                        </button>
                    </div>
                    <div class="grid-row has-background">
                        <span class="grid-label">{{translations.datum}}</span>
                        <span id="m-infocoordinates-datum" class="grid-value">ETRS89</span>
                    </div>
                    <div class="grid-row">
                        <span class="grid-label">{{translations.latitude}}</span>
                        <span id="m-infocoordinates-latitude" class="grid-value">--</span>
                        <button type="button" id="m-infocoordinates-copylatlon" class="icon-button" title="{{translations.copyLatLon}}">
                            <img src="{{helpIconUrlCopiar}}" />
                        </button>
                    </div>
                    <div class="grid-row has-background">
                        <span class="grid-label">{{translations.longitude}}</span>
                        <span id="m-infocoordinates-longitude" class="grid-value">--</span>
                    </div>
                    <div class="grid-row gms-row">
                        <div>
                            <span class="grid-label-gms-row"></span>
                            <input id="m-infocoordinates-buttonConversorFormat" type="checkbox" disabled>
                            <label for="m-infocoordinates-buttonConversorFormat">{{translations.formatCoordinates}}</label>
                        </div>
                    </div>

                    <div class="grid-row crs-row">
                        <div class="grid-label">
                            <span>CRS:</span>
                            {{#if hasHelp}}
                                <a href="{{helpUrl}}" class="help-icon" title="Ayuda EPSG" target="_blank">
                                    <img src="{{helpIconUrlInfo}}" alt="" />
                                </a>
                            {{/if}}
                        </div>
                        <select 
                            id="m-infocoordinates-srs-selector" 
                            class="crs-select m-infocoordinates-input-select"
                            aria-label="{{translations.select_srs}}"  
                            title="{{translations.select_srs}}"
                            tabindex="{{order}}"
                        >
                            <option value="" selected disabled>{{translations.choose_create_epsg}}</option>
                            {{#each projections}}
                                <option value="{{this.codes.[0]}}">{{this.codes.[0]}}</option>
                            {{/each}}
                        </select>
                    </div>

                    <div class="grid-row has-background coordx-row">
                        <span class="grid-label">{{translations.coordX}}</span>
                        <span id="m-infocoordinates-coordX" class="grid-value">--</span>
                        <!-- <button type="button" id="m-infocoordinates-copyxy" class="icon-button" title="{{translations.copyxy}}">
                            <img src="{{helpIconUrlCopiar}}" />
                        </button> -->
                    </div>

                    <div class="grid-row">
                        <span class="grid-label">{{translations.coordY}}</span>
                        <span id="m-infocoordinates-coordY" class="grid-value">--</span>
                    </div>

                    <div class="grid-row has-background">
                        <span class="grid-label">{{translations.altitude}}</span>
                        <span id="m-infocoordinates-altitude" class="grid-value">--</span>
                    </div>
                </div>
            </div>
            <div class="m-infocoordinates-div-buttonRemoveAllPoints noDisplay">
                <button type="button" tabindex="0" class="icon-bin2" id="m-infocoordinates-buttonRemoveAllPoints" title="{{translations.removeAllPoints}}">
                    <img src="{{helpIconUrlPapelera}}" alt="" />
                </button>
            </div>

            <div class="m-infocoordinates-div-buttonImportAllPoints noDisplay">
                <button type="button" tabindex="0" class="icon-file" id="m-infocoordinates-buttonImportAllPoints" title="{{translations.importAllPoints}}">
                    <img src="{{helpIconUrlImport}}" alt="" />
                </button>
            </div>

            <div class="m-infocoordinates-div-buttonCopyAllPoints noDisplay">
                <button type="button" tabindex="0" class="icon-copy" id="m-infocoordinates-buttonCopyAllPoints" title="{{translations.copyAllPoints}}">
                    <img src="{{helpIconUrlCopiar}}" alt="" />
                </button>
            </div>

            <div class="m-infocoordinates-div-buttonDisplayAllPoints noDisplay">
                <button type="button" tabindex="0" class="icon-displayON" id="m-infocoordinates-buttonDisplayAllPoints" title="{{translations.displayONAllPoints}}">
                    <img src="{{helpIconUrlAllPoints}}" alt="" />
                </button>
            </div>
        </div>
    </div>
</div>
