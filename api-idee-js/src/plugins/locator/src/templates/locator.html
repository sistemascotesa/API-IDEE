<div aria-label="Plugin Locator" role="menuitem" id="div-contenedor-locator" class="m-control m-container m-locator">
    <ul id="m-locator-previews">
        {{#if byPlaceAddressPostal}}
            <li tabindex="0" id="m-locator-ignsearch" title="{{translations.ignsearch}}" class="locator-icon-ignsearch"></li>
        {{/if}}
        {{#if byParcelCadastre}}
            <li tabindex="0" id="m-locator-infocatastro" title="{{translations.infocatastro}}" class="locator-icon-catastro"></li>
        {{/if}}
        {{#if byCoordinates}}
            <li tabindex="0" id="m-locator-xylocator" title="{{translations.xylocator}}" class="locator-icon-coordsearch"></li>
        {{/if}}
    </ul>
</div>
