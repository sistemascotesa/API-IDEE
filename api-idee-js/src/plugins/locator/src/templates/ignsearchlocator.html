<div id="m-ignsearch-panel" class="m-api-idee-tab-content m-ignsearch-container">
    <div class="m-ignsearchlocator-search-frame">
        <div id="m-ignsearchlocator-search-bar">
            <input type="text" tabindex="0" id="m-ignsearchlocator-search-input" class="m-input-search"
                autocomplete="off" title="{{placeholder}}" placeholder="{{placeholder}}" />
            {{#if reverse}}
                <button type="button"
                    tabindex="2"
                    id="m-ignsearchlocator-locate-button"
                    class="g-cartografia-info-point-on-plane"
                    title="{{translations.locate}}">
                </button>
            {{/if}}
        </div>
        <div id="m-ignsearchlocator-results" class="m-ignsearch-results">
            <!-- Here goes the list of search results -->
        </div>
    </div>
</div>
