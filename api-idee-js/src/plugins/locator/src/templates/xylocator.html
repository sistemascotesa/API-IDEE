<div id="m-xylocator-panel" class="m-xylocator-container">
  <div class="m-xylocator-datas">
    <div id="m-xylocator-coordinatesSystem" class="m-xylocator-coord-system">
      <div class="m-xylocator-selector-title">
        <label>{{translations.srs}}:</label>
        {{#if hasHelp}}
          <div class="m-xylocator-help-button" title="EPSG">
            <a href="{{helpUrl}}" target="_blank"><i class="locator-icon-help"></i></a>
          </div>
        {{/if}}
      </div>
      <select name="srs" id="m-xylocator-srs" class="dropdown">
        {{#if projections}}
          {{#each projections}}
            <option class="m-xylocator-srs-option" data-units="{{this.units}}" value="{{this.code}}">{{this.title}}</option>
          {{/each}}
        {{else}}
          <option class="m-xylocator-srs-option" data-units="d" value="EPSG:4258" option="selected">ETRS89
            {{translations.geographic}} (4258) {{translations.dd}}</option>
          <option class="m-xylocator-srs-option" data-units="d" value="EPSG:4326">WGS84 {{translations.geographic}} (4326)
            {{translations.dd}}</option>
          <option class="m-xylocator-srs-option" data-units="dms" value="EPSG:4258">ETRS89
            {{translations.geographic}} (4258) {{translations.dms}}</option>
          <option class="m-xylocator-srs-option" data-units="dms" value="EPSG:4326">WGS84 {{translations.geographic}}
            (4326) {{translations.dms}}</option>
          <option class="m-xylocator-srs-option" data-units="m" value="EPSG:3857">WGS84 Pseudo Mercator (3857)</option>
          <option class="m-xylocator-srs-option" data-units="m" value="EPSG:25831">ETRS89 UTM {{translations.zone}} 31N
            (25831)</option>
          <option class="m-xylocator-srs-option" data-units="m" value="EPSG:25830">ETRS89 UTM {{translations.zone}} 30N
            (25830)</option>
          <option class="m-xylocator-srs-option" data-units="m" value="EPSG:25829">ETRS89 UTM {{translations.zone}} 29N
            (25829)</option>
          <option class="m-xylocator-srs-option" data-units="m" value="EPSG:25828">ETRS89 UTM {{translations.zone}} 28N
            (25828)</option>
        {{/if}}
      </select>
    </div>
    <div id="m-xylocator-utm" class="m-xylocator-latlon-fields">
      <label for="UTM-X">X:</label>
      <input type="text" name="UTM-X" id="UTM-X" placeholder="234798,13">
      <label for="UTM-Y">Y:</label>
      <input type="text" name="UTM-Y" id="UTM-Y" placeholder="4154570,15">
    </div>
    <div id="m-xylocator-dms" class="m-xylocator-latlon-fields">
      <label for="LONHH">{{translations.longitude}}:</label>
      <div>
        <div class="m-xylocator-dms-input">
          <input type="number" name="LONHH" id="LONHH" value="0" min="0" max="180">
          <label for="LONHH">º</label>
        </div>
        <div class="m-xylocator-dms-input">
          <input type="number" name="LONMM" id="LONMM" value="0" min="0" max="59">
          <label for="LONMM">'</label>
        </div>
        <div class="m-xylocator-dms-input">
          <input type="number" name="LONSS" id="LONSS" value="0" min="0" max="59.9999">
          <label for="LONSS">''</label>
        </div>
        <div class="m-xylocator-dms-radio">
          <div>
            <input type="radio" name="LONDIR" value="east" checked>
            <label>{{translations.east}}</label>
          </div>
          <div>
            <input type="radio" name="LONDIR" value="west">
            <label>{{translations.west}}</label>
          </div>
        </div>
      </div>
      <label for="LATHH">{{translations.latitude}}:</label>
      <div>
        <div class="m-xylocator-dms-input">
          <input type="number" name="LATHH" id="LATHH" value="0" min="0" max="180">
          <label for="LATHH">º</label>
        </div>
        <div class="m-xylocator-dms-input">
          <input type="number" name="LATMM" id="LATMM" value="0" min="0" max="59">
          <label for="LATMM">'</label>
        </div>
        <div class="m-xylocator-dms-input">
          <input type="number" name="LATSS" id="LATSS" value="0" min="0" max="59.9999">
          <label for="LATSS">''</label>
        </div>
        <div class="m-xylocator-dms-radio">
          <div>
            <input type="radio" name="LATDIR" value="north" checked>
            <label>{{translations.north}}</label>
          </div>
          <div>
            <input type="radio" name="LATDIR" value="south">
            <label>{{translations.south}}</label>
          </div>
        </div>
      </div>
    </div>
    <div id="m-xylocator-latlon" class="m-xylocator-latlon-fields">
      <label for="LON">{{translations.longitude}}:</label>
      <input type="text" name="LON" id="LON" placeholder="-6,0">
      <label for="LAT">{{translations.latitude}}:</label>
      <input type="text" name="LAT" id="LAT" placeholder="37,5">
    </div>
    <div class="button">
      <button class="m-xylocator-represent" id="m-xylocator-loc" title="{{translations.locate}}">
        {{translations.locate}}
      </button>
      <button class="secondary" id="m-xylocator-limpiar" title="{{translations.clean}}">
        {{translations.clean}}
      </button>
    </div>
  </div>
</div>
