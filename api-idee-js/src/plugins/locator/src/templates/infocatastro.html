<div id="m-infocatastro-panel" class="m-api-idee-tab-content m-infocatastro-container">
  <div class="m-infocatastro-radio-group">
    <div>
      <input type="radio" id="m-infocatastro-radio-parcela" name="infocatastro-mode" value="parcela" checked>
      <label for="m-infocatastro-radio-parcela">{{translations.searchplot}}</label>
    </div>
    <div>
      <input type="radio" id="m-infocatastro-radio-catastro" name="infocatastro-mode" value="catastro">
      <label for="m-infocatastro-radio-catastro">{{translations.searchcadastre}}</label>
    </div>
  </div>
  <!-- Panel Parcela -->
  <div id="m-infocatastro-parcela-panel" class="m-infocatastro-parcela-container">
    <label for="m-searchParamsProvincia-select">{{translations.province}}:</label>
    <select role="select" tabindex="0" aria-label="{{translations.selectprov}}" id="m-searchParamsProvincia-select" name="srs" class="dropdown">
      <option value="0">{{translations.selectprov}}</option>
      <option value="02">ALBACETE</option>
      <option value="03">ALICANTE/ALACANT</option>
      <option value="04">ALMERÍA</option>
      <option value="01">ARABA/ÁLAVA</option>
      <option value="33">ASTURIAS</option>
      <option value="05">ÁVILA</option>
      <option value="06">BADAJOZ</option>
      <option value="07">BALEARS, ILLES</option>
      <option value="08">BARCELONA</option>
      <option value="48">BIZKAIA</option>
      <option value="09">BURGOS</option>
      <option value="10">CÁCERES</option>
      <option value="11">CÁDIZ</option>
      <option value="39">CANTABRIA</option>
      <option value="12">CASTELLÓN/CASTELLÓ</option>
      <option value="13">CIUDAD REAL</option>
      <option value="14">CÓRDOBA</option>
      <option value="15">CORUÑA, A</option>
      <option value="16">CUENCA</option>
      <option value="20">GIPUZKOA</option>
      <option value="17">GIRONA</option>
      <option value="18">GRANADA</option>
      <option value="19">GUADALAJARA</option>
      <option value="21">HUELVA</option>
      <option value="22">HUESCA</option>
      <option value="23">JAÉN</option>
      <option value="24">LEÓN</option>
      <option value="25">LLEIDA</option>
      <option value="27">LUGO</option>
      <option value="28">MADRID</option>
      <option value="29">MÁLAGA</option>
      <option value="30">MURCIA</option>
      <option value="31">NAVARRA</option>
      <option value="32">OURENSE</option>
      <option value="34">PALENCIA</option>
      <option value="35">PALMAS, LAS</option>
      <option value="36">PONTEVEDRA</option>
      <option value="26">RIOJA, LA</option>
      <option value="37">SALAMANCA</option>
      <option value="38">SANTA CRUZ DE TENERIFE</option>
      <option value="40">SEGOVIA</option>
      <option value="41">SEVILLA</option>
      <option value="42">SORIA</option>
      <option value="43">TARRAGONA</option>
      <option value="44">TERUEL</option>
      <option value="45">TOLEDO</option>
      <option value="46">VALENCIA/VALÈNCIA</option>
      <option value="47">VALLADOLID</option>
      <option value="49">ZAMORA</option>
      <option value="50">ZARAGOZA</option>
      <option value="51">CEUTA</option>
      <option value="52">MELILLA</option>
    </select>
    <label for="m-searchParamsMunicipio-select">{{translations.municipality}}:</label>
    <select id="m-searchParamsMunicipio-select" name="Municipios" class="dropdown" aria-label="{{translations.selectmuni}}">
      <option value="0">{{translations.selectmuni}}</option>
    </select>
    <label for="m-searchParamsPoligono-input">{{translations.estate}}:</label>
    <input type="text" tabindex="0" id="m-searchParamsPoligono-input">
    <label for="m-searchParamsParcela-input">{{translations.plot}}:</label>
    <input type="text" tabindex="0" id="m-searchParamsParcela-input">
    <div class="buttonOptions">
      <button class="m-infocatastro-search" id="m-infocatastro-searchParams" title="{{translations.search}}">
        {{translations.search}}
      </button>
      <button class="secondary" id="m-infocatastro-parcela-limpiar" title="{{translations.clean}}">
        {{translations.clean}}
      </button>
    </div>
  </div>
  <!-- Panel Catastro -->
  <div id="m-infocatastro-catastro-panel" class="m-infocatastro-catastro-container">
    <label for="m-refCatastral-input">{{translations.refCastatro}}:</label>
    <input type="text" tabindex="0" aria-label="{{translations.insertCadastre}}" id="m-refCatastral-input"
    maxlength="20">
    <button type="button" tabindex="0" aria-label="{{translations.search}}" class="represent" id="m-infocatastro-refCatastral">
      <i class="locator-icon-catastro-buscar"></i> {{translations.search}}
    </button>
    <p tabindex="0" role="text" aria-label="{{translations.notaRef}}" id="m-informa" class="parcela--input">
      {{translations.notaRef}}
    </p>
    <div class="buttonOptions">
      <button type="button" tabindex="0" aria-label="{{translations.consultReference}}" class="m-infocatastro-represent g-cartografia-info-consulta" id="m-infocatastro-consulRef">
        <span>{{translations.consultReference}}</span>
      </button>
      <button class="secondary" id="m-infocatastro-catastro-limpiar" title="{{translations.clean}}">
        {{translations.clean}}
      </button>
    </div>
  </div>
</div>
