<div class="m-container m-printermap m-printermap-container d-flex-column">
    <div class="m-printermap-title-container d-flex-column">
        <label tabindex="0" for="m-printermap-title" role="text" aria-label="{{translations.title}}">{{translations.title}} </label>
        <input tabindex="0" id="m-printermap-title" aria-label="{{translations.title}}" type="text" title="{{translations.title}}" placeholder="{{translations.title}}">
    </div>
    <div class="m-printermap-format-container d-flex-column">
        <label tabindex="0" for="m-printermap-format" role="text" aria-label="{{translations.format}}">{{translations.format}} </label>
        <select tabindex="0" role="select" id="m-printermap-format" title="{{translations.format}}">
            {{#each formats}}
                <option value="{{this}}" {{#if default}} selected{{/if}}>{{this}}</option>
            {{/each}}
        </select>
    </div>

    <hr/>

    <div class="m-printermap-download-button button-container" id="m-printermap-download-button">
        <b>{{translations.map}}</b>
        <button tabindex="0" id="m-printermap-print" class="g-cartografia-download-file backimg-button" title="{{translations.download}}">{{translations.download}}</button>
    </div>

    <hr/>

    <b>{{translations.mapWithTemplate}}</b>

    <div class="m-printermap-loadTemplate-container d-flex-column">
        <label for="m-printermap-uploaded-templates" class="m-printermap-paramsLabel" tabindex="0" role="text" aria-label="{{translations.preloadedTemplates}}">{{translations.preloadedTemplates}}</label>
        <select id="m-printermap-uploaded-templates" class="m-printermap-template-select" disabled>
            <option disabled hidden selected>-- {{translations.preloadedTemplates}} --</option>
        </select>
    </div>

    <label>{{translations.customTemplates}}</label>

    <div class="m-printermap-customizeTemplate-container d-flex">
        <input type="file" id="m-printermap-template-upload" accept=".html,.txt" title=" " class="m-printermap-file-input">
        <button tabindex="0" id="m-printermap-upload-button" class="uploadTemplate backimg-button" title="{{translations.uploadTemplate}}">{{translations.uploadTemplate}}</button>
        <span><a href="https://github.com/administradorcnig/Wiki-APIIDEE-2.0.0/wiki/printviewmanagement" target="_blank">{{translations.helpCustomTemplates}}</a></span>
        <button tabindex="0" id="m-printermap-customize-button" class="customTemplate backimg-button g-cartografia-open-window" title="{{translations.download}}">{{translations.download}}</button>
    </div>
</div>
