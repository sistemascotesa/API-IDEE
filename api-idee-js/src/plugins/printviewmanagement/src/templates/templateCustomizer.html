<div class="m-templateCustomizer-container" id="m-customize-template">
  <div class="m-templateCustomizer-left-wrapper d-flex">
    <form class="m-customize-template-form d-flex-column">
      <div class="m-templateCustomizer-option template-option">
        <span>{{translations.mapElements}}</span>
        {{#each templateElements}}
          <label class="d-flex">
            <input type="checkbox" id="m-show-{{this.id}}" name="m-show-{{this.id}}" checked>
            <span>{{this.label}}</span>
          </label>
        {{/each}}
      </div>

      <div class="m-templateCustomizer-option template-orientation">
        <span>{{translations.mapOrientation}}</span>
        <label class="d-flex">
          <input type="radio" name="map-orientation" value="vertical">
          <span>{{translations.vertical}}</span>
        </label>
        <label class="d-flex">
          <input type="radio" name="map-orientation" value="horizontal" checked>
          <span>{{translations.horizontal}}</span>
        </label>
      </div>

      <div class="m-templateCustomizer-option template-layout">
        <label for="template-layout">{{translations.layout}}</label>
        <select id="template-layout">
          {{#each layoutOptions}}
            <option value="{{this.value}}" {{#if default}} selected{{/if}}>{{this.label}}</option>
          {{/each}}
        </select>
      </div>

      <div class="m-templateCustomizer-option template-scale">
        <label for="template-scale">{{translations.scale}}</label>
        <input type="text" id="template-scale" value="1:{{defaultScale}}">
      </div>

      <div class="m-templateCustomizer-option template-srs">
        <!-- Deshabilitado hasta que se arregle la reproyección de capas -->
        <label for="epsg-selected">{{translations.select_srs}}</label>
        <input
          type="text"
          id="epsg-selected"
          class="m-templateCustomizer-input-srs"
          name="epsg-selected"
          value="{{defaultProjection}}"
          aria-label="{{translations.select_srs}}"
          title="{{translations.select_srs}}"
          tabindex="{{order}}"
          autocomplete="off"
          readonly="readonly"
          disabled
        />
        <ul title="{{translations.select_srs}}" id="m-customize-template-srs-selector" class="m-templateCustomizer-srs-list">
          <li><a href="#" value="default" tabindex="-1" disabled>{{translations.choose_create_epsg}}</a></li>
          {{#each projectionsOptions}}
            <li><a href="#" value="{{this.codes.[0]}}">{{this.codes.[0]}}</a></li>
          {{/each}}
        </ul>
      </div>

      <div class="m-templateCustomizer-option template-dpi">
        <label for="template-dpi">{{translations.dpi}}</label>
        <select id="template-dpi">
          {{#each dpiOptions}}
            <option value="{{this}}" {{#if default}} selected{{/if}}>{{this}}</option>
          {{/each}}
        </select>
      </div>
    </form>
    <button id="m-templateCustomizer-download-button" class="templateDownload">{{translations.apply}}</button>
  </div>
  <div class="m-templateCustomizer-right-wrapper">
    <div class="m-templateCustomizer-map-preview" id="m-customize-template-right"></div>
  </div>
</div>
