<div aria-label="Plugin View Management" role="menuitem" id="div-contenedor-printviewmanagement" class="m-plugin-panel-content m-printviewmanagement">

    <!-- Contenedor de controles -->
    <ul id="m-printviewmanagement-previews" class="m-api-idee-tabs-container">
        {{#if printermap}}
        <li tabindex="0" id="m-printviewmanagement-printermap" title="{{translations.printermap}}" class="m-api-idee-tab printviewmanagement-icon-flecha-historial"></li>
        {{/if}}
        {{#if georefImage}}
        <li tabindex="0" id="m-printviewmanagement-georefImage" title="{{translations.georefImage}}" class="m-api-idee-tab printviewmanagement-icon-zoom-extension"></li>
        {{/if}}
        {{#if georefImageEpsg}}
        <li tabindex="0" id="m-printviewmanagement-georefImageEpsg" title="{{translations.tooltipGeorefImageEpsg}}" class="m-api-idee-tab printviewmanagement-georefImageEpsg"></li>
        {{/if}}
    </ul>

     <!-- Contenedor de controles -->
    <section id="m-printviewmanagement-controls" class="m-printviewmanagement-controls"></section>

    <!-- Botones para descargar -->
    <div class="m-georefimage-download-button" id="m-georefimage-download-button" style="display: none;">
        <button tabindex="0" id="m-printviewmanagement-print" class="print" title="{{translations.downImg}}">{{translations.downImg}}</button>
    </div>
</div>
