<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Plantilla AMB</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        :root {
            --superior-height: 10.58mm;
            --inferior-height: 10.58mm;
            --gap: 2mm;
        }

        .api-idee-template-container {
            width: 90%;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .interior-container {
            width: 90%;
            margin: auto;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr 17fr 1fr;
            grid-template-rows: 1fr 14fr 1fr;
            position: absolute;
            top: calc(var(--superior-height) + var(--gap));
            height: calc(100% - var(--superior-height) - var(--inferior-height) - 2 * var(--gap));
        }

        .api-idee-template-container:not(:has(.superior-container)) .interior-container {
            top: 0;
            height: calc(100% - var(--inferior-height) - var(--gap));
        }

        .api-idee-template-container:not(:has(.inferior-container)) .interior-container {
            top: calc(var(--superior-height) + var(--gap));
            height: calc(100% - var(--superior-height) - var(--gap));
        }

        .api-idee-template-container:not(:has(.superior-container, .inferior-container)) .interior-container {
            top: 0 !important;
            height: 100% !important;
        }

        .api-idee-template-container:not(:has(.interior-container)) .imagen-mascara {
            margin: auto;
            height: calc(100% - var(--superior-height) - var(--inferior-height) - 2 * var(--gap));
        }

        .api-idee-template-container:not(:has(.interior-container, .inferior-container)) .imagen-mascara {
            margin: auto;
            top: calc(var(--superior-height) + var(--gap));
            height: calc(100% - var(--superior-height) - var(--gap));
        }

        .api-idee-template-container:not(:has(.interior-container, .superior-container)) .imagen-mascara {
            margin: auto;
            top: 0;
            width: 90%;
            position: absolute;
            height: calc(100% - var(--inferior-height) - var(--gap));
        }

        .api-idee-template-container:not(:has(.interior-container, .superior-container, .inferior-container)) .imagen-mascara {
            margin: auto;
            height: 100%;
        }

        .inferior-container, .superior-container {
            width: 90%;
            margin: auto;
            box-sizing: border-box;
            display: grid;
            grid-template-rows: 1fr;
            position: absolute;
            min-height: 50px;
        }

        .superior-container {
            align-items: center;
            grid-template-columns: 1fr auto;
            top: 0;
        }

        .superior-container img {
            height: 40px;
        }

        .inferior-container {
            grid-template-columns: 2fr 8fr;
            bottom: -20px;
        }

        .cell {
            box-sizing: border-box;
            display: grid;
            min-width: 50px;
        }

        .cell-top-left, .cell-top-center, .cell-top-right {
            border-bottom: 1px solid;
        }

        .cell-bottom-left, .cell-bottom-center, .cell-bottom-right {
            border-top: 1px solid;
        }

        .cell-top-left, .cell-left-center, .cell-bottom-left {
            border-right: 1px solid;
        }

        .cell-top-right, .cell-right-center, .cell-bottom-right {
            border-left: 1px solid;
        }

        .cell-interior {
            padding: 7px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            height: 100%;
        }

        .imagen-mascara {
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .imagen-mascara .ol-viewport {
            height: 100% !important;
        }

        .vertical-texts, .horizontal-texts {
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }

        .left-text, .right-text {
            align-self: flex-end;
            padding: 7px;
        }

        .horizontal-texts .left-text {
            align-self: flex-start;
        }

        .titulo-principal, .body-text {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 20px;
            height: 100%;
        }

        .titulo-principal {
            font-size: 18px;
            font-weight: bold;
        }

        .body-text {
            font-size: 10px;
            letter-spacing: 1px;
        }

        .small-text, .small-text-inferior {
            font-size: 0.5em;
            letter-spacing: 1px;
        }

        .small-top-text, .small-bottom-text {
            display: flex;
            flex-direction: row;
        }

        .small-bottom-text span {
            align-self: normal;
        }

        .border-full {
            border: 1px solid;
        }

        .border-left {
            border-left: 1px solid;
        }

        .border-top {
            border-top: 1px solid;
        }
    </style>
</head>
<body>
    <div class="api-idee-template-container" id="api-idee-template-container">
        
        <div class="superior-container" data-type="api-idee-template-titulo">
            <div class="titulo-principal" contenteditable="true">Introduzca título...</div>
            <div class="logo-right">
                <img src="https://www.amb.cat/theme-resources/generic/images/logo-amb-15-aniv.gif" alt="Logo AMB">
            </div>
        </div>

        <div class="interior-container" data-type="api-idee-template-borde">
            <div class="cell cell-top-left"></div>
            <div class="cell cell-top-center">
                <div class="vertical-texts small-text small-top-text">
                    <span class="left-text" id="top-left-coord"></span>
                    <span class="right-text" id="top-right-coord"></span>
                </div>
            </div>
            <div class="cell cell-top-right"></div>
            <div class="cell small-text cell-left-center">
                <div class="horizontal-texts">
                    <span class="left-text" id="left-top-coord"></span>
                    <span class="right-text" id="left-bottom-coord"></span>
                </div>
            </div>
            <div class="cell imagen-mascara" id="imagen-mascara"></div>
            <div class="cell small-text cell-right-center">
                <div class="horizontal-texts">
                    <span class="left-text" id="right-top-coord"></span>
                    <span class="right-text" id="right-bottom-coord"></span>
                </div>
            </div>
            <div class="cell cell-bottom-left"></div>
            <div class="cell small-text cell-bottom-center">
                <div class="vertical-texts small-bottom-text">
                    <span class="left-text" id="bottom-left-coord"></span>
                    <span class="right-text" id="bottom-right-coord"></span>
                </div>
            </div>
            <div class="cell cell-bottom-right"></div>
        </div>
        <div class="inferior-container border-full" data-type="api-idee-template-texto-libre" data-type-name="descripcion">
            <div class="cell small-text-inferior">
                <div class="cell horizontal-texts cell-interior" id="current-date"></div>
                <div class="cell horizontal-texts cell-interior border-top" id="map-epsg"></div>
            </div>
            <div class="cell body-text border-left" contenteditable="true">Introduzca descripción...</div>
        </div>
    </div>
</body>
</html>
