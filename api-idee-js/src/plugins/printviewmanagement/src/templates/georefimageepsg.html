<div class="m-container m-georefimageepsg m-georefimageepsg-container d-flex-column">
  <div class="m-georefimageepsg-layer-container d-flex-column">
    <label for="m-georefimageepsg-select">{{translations.selectLayer}}</label>
    <select id="m-georefimageepsg-select" title="{{translations.selectLayer}}">
      {{#each layers}}
        <option value='{{name}}'>{{legend}}</option>
      {{/each}}
    </select>
  </div>
  <div class="m-georefimageepsg-dpi-container d-flex-column">
    <label tabindex="0" for="m-georefimageepsg-dpi" role="text" aria-label="{{translations.selectDpi}}">{{translations.selectDpi}}</label>
    <select tabindex="0" role="select" id="m-georefimageepsg-dpi" title="{{translations.selectDpi}}">
        {{#each dpis}}
            <option value="{{this}}" {{#if default}} selected{{/if}}>{{this}}</option>
        {{/each}}
    </select>
  </div>

  <hr>

  <div class="m-georefimageepsg-download-button button-container" id="m-georefimageepsg-download-button">
    <b>{{translations.image}}</b>
    <button tabindex="0" id="m-georefimageepsg-print" class="g-cartografia-download-file backimg-button" title="{{translations.download}}">{{translations.download}}</button>
  </div>
</div>
