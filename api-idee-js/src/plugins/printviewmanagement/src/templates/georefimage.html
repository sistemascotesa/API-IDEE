<div class="m-container m-georefimage m-georefimage-container d-flex-column">
    <div class="m-georefimage-title-container d-flex-column">
        <label tabindex="0" for="m-georefimage-title" title="{{translations.title}}" aria-label="{{translations.format}}">{{translations.title}}</label>
        <input tabindex="0" type="text" id="m-georefimage-title" aria-label="{{translations.title}}" title="{{translations.title}}" name="title-georefimage" placeholder="{{translations.title}}">
    </div>
    <div class="m-georefimage-format-container d-flex-column">
        <label tabindex="0" for="m-georefimage-format" title="{{translations.format}}" aria-label="{{translations.format}}">{{translations.format}}</label>
        <select tabindex="0" role="select" id="m-georefimage-format" title="{{translations.format}}">
            {{#each formats}}
                <option value="{{this}}" {{#if default}} selected{{/if}}>{{this}}</option>
            {{/each}}
        </select>
    </div>
    <div class="m-georefimage-dpi-container d-flex-column">
        <label tabindex="0" for="m-georefimage-dpi" role="text" aria-label="{{translations.selectDpi}}">{{translations.selectDpi}}</label>
        <select tabindex="0" role="select" id="m-georefimage-dpi" title="{{translations.selectDpi}}">
            {{#each dpis}}
                <option value="{{this}}" {{#if default}} selected{{/if}}>{{this}}</option>
            {{/each}}
        </select>
    </div>
    <div class="m-georefimage-wld-container d-flex">
        <label tabindex="0" for="m-georefimage-wld" title="{{translations.georefimageWld}}" aria-label="{{translations.georefimageWld}}">{{translations.georefimageWld}}</label>
        <input tabindex="0" value="wld" type="checkbox" title="{{translations.georefimageWld}}" id="m-georefimage-wld" aria-label="{{translations.georefimageWld}}">
    </div>
    <h3 tabindex="0" id="m-georefimage-projection" class="m-georefimage-projection" title="EPSG"></h3>

    <hr>

    <div class="m-georefimage-download-button button-container" id="m-georefimage-download-button">
        <b>{{translations.image}}</b>
        <button tabindex="0" id="m-georefimage-print" class="g-cartografia-download-file backimg-button" title="{{translations.download}}">{{translations.download}}</button>
    </div>
</div>
