<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="idee" content="yes">

    <title>PRUEBA DESARROLLO</title>
</head>

<body>
    <div class="m-api-idee-test-form-frame">
        <div class="m-test-form">
            <div>
                <label for="selectPosicion" title="Posición del Control">Posición del panel "position"</label>
                <select name="position" id="selectPosicion">
                    <option value="left" selected="selected">Izquierda (left)</option>
                    <option value="right">Derecha (right)</option>
                    <option value="center-top-left">Centro superior izquierdo (center-top-left)</option>
                    <option value="center-top-right">Centro superior derecho (center-top-right)</option>
                    <option value="center-bottom-left">Centro inferior izquierdo (center-bottom-left)</option>
                    <option value="center-bottom-right">Centro inferior derecho (center-bottom-left)</option>
                    <option value="down">Abajo (down)</option>
                </select>
            </div>
            <div>
                <label for="order" title="Define en que posición del panel debe aparecer en el conjunto de controles o plugins">Posición en el panel "order"</label>
                <input type="number" name="order" id="inputOrder" list="orderSug" value="-1">
            </div>
            <div>
                <label for="selectCollapsed">Panel colapsado "collapsed"</label>
                <select name="collapsed" id="selectCollapsed">
                    <option value=''></option>
                    <option value="true">true</option>
                    <option value="false" selected="selected">false</option>
                </select>
            </div>
            <div>
                <label for="selectCollapsible">Panel colapsable "collapsible"</label>
                <select name="collapsible" id="selectCollapsible">
                    <option value=''></option>
                    <option value="true" selected="selected">true</option>
                    <option value="false">false</option>
                </select>
            </div>
            <div>
                <label for="inputTooltip">Título informativo del panel y control "tooltip"</label>
                <input type="text" name="tooltip" id="inputTooltip" list="tooltipSug" value="">
            </div>
            <div>
                <label for="inputTitle" title="Reemplaza el valor del tooltip por defecto para el título del panel">
                    Título del panel del control "title"</label>
                <input type="text" name="tooltip" id="inputTitle" list="tooltipSug" value="">
            </div>
        </div>
        <div class="m-test-buttons" style="background-color: rgb(89, 114, 104);">
            <button name="remove control" class="m-test-button" id="removeButton">Eliminar Control</button>
            <button name="remove osm" class="m-test-button" id="removeLayerOSM">Eliminar Capa OSM</button>
            <button name="add OSM" class="m-test-button" id="addLayerOSM">Añadir Capa OSM</button>
        </div>
    </div>
    <div id="map" class="map"></div>
    <script src="/config.js" charset="utf-8"></script>
    <script src="/CP-0003-controls/CP-009.js" charset="utf-8"></script>
</body>

</html>
